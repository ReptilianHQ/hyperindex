name: Publish Reptilian Envio runtime

on:
  push:
    tags:
      - "v3.5.0-reptilian.*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UPSTREAM_PLATFORM_VERSION: 3.5.0

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_run_id: ${{ steps.find_build.outputs.run_id }}
    steps:
      - name: Validate release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^3\.5\.0-reptilian\.[0-9]+$ ]]; then
            echo "Unsupported fork version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Find release-verified Build & Verify run
        id: find_build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=""
          for candidate in $(gh api "repos/${{ github.repository }}/actions/workflows/build_and_verify.yml/runs?head_sha=${{ github.sha }}&status=completed&per_page=10" --jq '.workflow_runs[].id'); do
            required=$(gh api "repos/${{ github.repository }}/actions/runs/${candidate}/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "build-envio-package" or .name == "cargo-test" or .name == "hypersync-health-check")]')
            count=$(echo "$required" | jq 'length')
            failures=$(echo "$required" | jq '[.[] | select(.conclusion != "success")] | length')
            if [ "$count" = "3" ] && [ "$failures" = "0" ]; then
              run_id="$candidate"
              break
            fi
          done
          if [ -z "$run_id" ]; then
            echo "No Build & Verify run with successful artifact, Rust, and HyperSync jobs found for ${{ github.sha }}"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  publish:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Download verified Envio artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-pkg-envio
          path: ./pkg
          run-id: ${{ needs.prepare.outputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set scoped package identity
        working-directory: ./pkg
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name = "@reptilianhq/envio";
            pkg.version = process.env.VERSION;
            pkg.repository = {
              type: "git",
              url: "git+https://github.com/ReptilianHQ/hyperindex.git"
            };
            pkg.optionalDependencies = Object.fromEntries(
              Object.keys(pkg.optionalDependencies ?? {}).map(name => [
                name,
                process.env.UPSTREAM_PLATFORM_VERSION
              ])
            );
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          npm pack --dry-run

      - name: Publish scoped runtime
        working-directory: ./pkg
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: npm publish --access public --tag reptilian --provenance

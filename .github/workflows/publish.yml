name: Publish Reptilian Envio runtime

on:
  push:
    tags:
      - "v3.9.0-reptilian.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release version whose runtime package needs recovery"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_run_id: ${{ steps.find_build.outputs.run_id }}
    steps:
      - name: Validate release version
        id: version
        shell: bash
        env:
          RECOVERY_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${RECOVERY_VERSION}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^3\.9\.0-reptilian\.[0-9]+$ ]]; then
            echo "Unsupported fork version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Find release-verified Build & Verify run
        id: find_build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          release_sha="${GITHUB_SHA}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag_object=$(gh api "repos/${{ github.repository }}/git/ref/tags/v${VERSION}")
            release_sha=$(echo "$tag_object" | jq -r '.object.sha')
            if [ "$(echo "$tag_object" | jq -r '.object.type')" = "tag" ]; then
              release_sha=$(gh api "repos/${{ github.repository }}/git/tags/${release_sha}" --jq '.object.sha')
            fi
          fi
          run_id=""
          for candidate in $(gh api "repos/${{ github.repository }}/actions/workflows/build_and_verify.yml/runs?head_sha=${release_sha}&status=completed&per_page=10" --jq '.workflow_runs[].id'); do
            # TEMPORARY: hypersync-health-check is excluded from this release gate.
            # It probes every supported public EVM HyperSync endpoint, so an
            # unrelated endpoint outage (currently chain 255) can fail independently
            # of the release artifacts. Revert once endpoint health is non-blocking.
            required=$(gh api "repos/${{ github.repository }}/actions/runs/${candidate}/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "build-envio-package" or .name == "cargo-test" or .name == "template-tests" or (.name | startswith("envio-tests")) or .name == "scenarios-test" or .name == "e2e-test")]')
            count=$(echo "$required" | jq 'length')
            failures=$(echo "$required" | jq '[.[] | select(.conclusion != "success")] | length')
            if [ "$count" = "7" ] && [ "$failures" = "0" ]; then
              run_id="$candidate"
              break
            fi
          done
          if [ -z "$run_id" ]; then
            echo "No fully successful deterministic Build & Verify run found for ${{ github.sha }}"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  build-platforms:
    if: github.event_name == 'push'
    needs: prepare
    uses: ./.github/workflows/build-platforms.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish-platforms:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [prepare, build-platforms]
    strategy:
      matrix:
        platform:
          - linux-x64
          - linux-x64-musl
          - linux-arm64
          - darwin-x64
          - darwin-arm64
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Download verified platform artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-pkg-envio-${{ matrix.platform }}
          path: ./pkg

      - name: Set scoped platform identity
        working-directory: ./pkg
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name = pkg.name.startsWith("@reptilianhq/")
              ? pkg.name
              : `@reptilianhq/${pkg.name}`;
            pkg.version = process.env.VERSION;
            pkg.repository = {
              type: "git",
              url: "git+https://github.com/ReptilianHQ/hyperindex.git"
            };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          npm pack --dry-run

      - name: Publish scoped platform
        working-directory: ./pkg
        run: npm publish --access public --tag reptilian --provenance

  publish-runtime:
    if: >-
      always()
      && needs.prepare.result == 'success'
      && (github.event_name == 'workflow_dispatch' || needs.publish-platforms.result == 'success')
    runs-on: ubuntu-latest
    needs: [prepare, publish-platforms]
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Download verified Envio artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-pkg-envio
          path: ./pkg
          run-id: ${{ needs.prepare.outputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set scoped package identity
        working-directory: ./pkg
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name = "@reptilianhq/envio";
            pkg.version = process.env.VERSION;
            pkg.repository = {
              type: "git",
              url: "git+https://github.com/ReptilianHQ/hyperindex.git"
            };
            pkg.bin = { envio: "bin.mjs" };
            pkg.optionalDependencies = Object.fromEntries(
              Object.keys(pkg.optionalDependencies ?? {}).map(name => [
                name.startsWith("@reptilianhq/") ? name : `@reptilianhq/${name}`,
                process.env.VERSION
              ])
            );
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          npm pack --dry-run

      - name: Publish scoped runtime
        working-directory: ./pkg
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: npm publish --access public --tag reptilian --provenance
